# /opt/colony_system/config/plates.yaml
# 培养板几何配置文件。
# workflow/config_loader.py 会根据 task.plate_type 选择对应板型；
# workflow/plate_geometry.py 和 workflow/scan_planner.py 会用这些参数把孔位名转换成位移台坐标。
#
# 几何拆分：
# - well_diameter_mm：培养面内径，用于孔心恢复和孔内视野规划
# - a1_start / well_teach：示教点（4x，画面右侧刚贴内径内壁）
# - a1_start.reference_fov_mm：示教时视野；five_point：五点径向比例和完整视野留边
# - well_step：由 A1、行末端、列末端均分得到的换孔脉冲步长；对角点只记录，不参与换孔
# well_gap_mm 只作备注，不参与换孔。

# 板型配置顶层字段，不能删除；配置加载器会检查该字段是否存在。
plates:
  # 6 孔板配置。
  "6-well":
    # 培养板行数；6 孔板通常为 2 行，孔位行为 A~B。
    rows: 2
    # 培养板列数；6 孔板通常为 3 列，孔位列为 1~3。
    cols: 3

    # A1 孔观测起始点，是整块板坐标推算的基准点。
    a1_start:
      # 原示教时的固定视野，不随当前物镜或 ROI 改变。
      reference_objective: "4x"
      reference_fov_mm:
        width: 3.22
        height: 3.22
      # A1 孔左侧观测起始点的 X 轴绝对坐标，单位：pulse。
      x: 6067028
      # A1 孔左侧观测起始点的 Y 轴绝对坐标，单位：pulse。
      y: 6594411
      # 基准点含义说明，仅用于记录和排查。
      meaning: "A1孔左侧观测起始点（画面右侧刚贴内径内壁）"

    # 同行最远孔、同列最远孔、对角孔的示教坐标。前两点均分 well_step；对角只存档。
    well_teach:
      row_end:
        well: A3
        x: 940865
        y: 6594411
      col_end:
        well: B1
        x: 6061291
        y: 1472051
      diagonal:
        well: B3
        x: 934157
        y: 1472051

    # 培养面内径，单位：mm。扫描圆半径 = 内径/2 − 当前物镜半视野。
    well_diameter_mm: 34.28
    # 非中心点距孔心的半径比例，以及完整视野距孔壁的最小余量（mm）。
    five_point:
      radial_fraction: 0.5
      edge_margin_mm: 0.5
    # 历史外沿间隙，单位：mm。不参与换孔计算。
    well_gap_mm: 4
    # 示教换孔步长，单位：pulse。由 A1 与行末端/列末端均分，已含现场方向。
    well_step:
      col:
        x: -2563082
        y: 0
      row:
        x: -5737
        y: -5122360
    # 位移台换算系数，X 对应电机1，Y 对应电机2，单位：pulse/mm。
    pulses_per_mm:
      x: 65536
      y: 131072

    # 孔内扫描方向符号。
    # 图像视野向右移动时，位移台 X 轴（电机 1）的运动方向。
    x_stage_sign_for_view_right: -1
    # 图像视野向下移动时，位移台 Y 轴（电机 2）的运动方向。
    y_stage_sign_for_view_down: -1

    # 扫描前的位移台安全限位检查。
    stage_limits:
      # 是否启用扫描路径越界预检查。
      enabled: true
      # X 轴实测最小物理硬限位，达到后旋钮不能继续转动，单位：pulse。
      x_min: -1369032
      # X 轴实测最大物理硬限位，达到后旋钮不能继续转动，单位：pulse。
      x_max: 6525977
      # Y 轴实测最小物理硬限位，达到后旋钮不能继续转动，单位：pulse。
      y_min: -1000000
      # Y 轴实测最大物理硬限位，达到后旋钮不能继续转动，单位：pulse。
      y_max: 9500000
      # 两轴共用安全边界，取较大的 Y 轴 1 mm 脉冲数；对应 X 轴 2 mm、Y 轴 1 mm。
      safety_margin: 131072

    # 运行时运动保护配置。workflow.scan_executor._get_runtime_guard
    runtime_guard:
      # 是否启用移动后检查，检查实际运动是否符合预期。
      enabled: true
      # 计划移动量超过该值时，才认为本次移动“应该明显发生”，单位：pulse。
      stuck_min_expected_move_pulse: 20000
      # 如果实际移动量小于该值，则判定疑似卡死或撞限位，单位：pulse。
      stuck_max_actual_move_pulse: 1000
      # 到位误差超过该值时判定移动失败，单位：pulse。
      max_err_to_target_pulse: 3000
      # 运动保护触发时是否中止任务。
      abort_on_motion_failure: true

